name: release-electron

# Dois modos, escolhidos por `publish_release`:
#   false (padrão) → CANDIDATO: build, testes, validação de versão/artefatos/feed/Authenticode
#                    e upload como artifact do Actions. NÃO cria tag nem release.
#   true           → PUBLICAÇÃO: o mesmo pipeline e, só se Authenticode = Valid e o commit
#                    já estiver na main, cria a release v1.0.12 (EXE + blockmap + latest.yml).
# Em nenhum dos modos um EXE sem Authenticode válido é aceito: o job termina em falha.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag exato da versão final 1.0.12"
        required: true
        type: string
      publish_release:
        description: "Criar a release pública v1.0.12 (somente após candidato homologado e merge na main)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest

    steps:
      - name: Checkout do ref solicitado
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Registrar commit exato e modo
        id: commit
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          Write-Host "Commit em build: $sha"
          Write-Host "publish_release: $env:PUBLISH_RELEASE"
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Publicação exige commit já mesclado na main
        if: inputs.publish_release
        shell: pwsh
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "publish_release=true exige um commit já mesclado na main. Rode como candidato (publish_release=false)."
          }
          Write-Host "Commit está na main."

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar versão final
        working-directory: desktop
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "1.0.12") {
            throw "Versão inesperada: $($package.version)"
          }
          Write-Host "Versão validada: 1.0.12"

      - name: Validar configuração de assinatura
        id: signing
        shell: pwsh
        env:
          WIN_CSC_LINK_VALUE: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_PASSWORD_VALUE: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $hasLink = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK_VALUE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_PASSWORD_VALUE)

          if ($hasLink -xor $hasPassword) {
            throw "Configuração Authenticode incompleta: os dois secrets precisam existir juntos."
          }

          if ($hasLink -and $hasPassword) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "Authenticode configurado."
          } else {
            if ($env:PUBLISH_RELEASE -eq "true") {
              throw "FALTA_CERTIFICADO_AUTHENTICODE: publish_release=true exige WIN_CSC_LINK e WIN_CSC_KEY_PASSWORD."
            }
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "Authenticode não configurado. O candidato será construído para inspeção, mas o job terminará em falha."
          }

      - name: Instalar dependências do desktop
        working-directory: desktop
        run: npm ci

      - name: Testes do desktop
        working-directory: desktop
        run: npm test

      - name: Build do instalador
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 -c electron-builder.yml --publish never

      - name: Validar artefatos 1.0.12
        id: artefatos
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = "dist/Obaflix-Setup-1.0.12.exe"
          $blockmap = "dist/Obaflix-Setup-1.0.12.exe.blockmap"
          $latest = "dist/latest.yml"

          foreach ($arquivo in @($exe, $blockmap, $latest)) {
            if (-not (Test-Path $arquivo)) {
              throw "Artefato ausente: $arquivo"
            }
          }

          $latestText = Get-Content $latest -Raw

          if ($latestText -notmatch '(?m)^version:\s*1\.0\.12\s*$') {
            throw "latest.yml não declara 1.0.12"
          }

          if ($latestText -notmatch '(?m)^\s*-\s*url:\s*Obaflix-Setup-1\.0\.12\.exe\s*$') {
            throw "latest.yml (files[].url) não referencia o EXE final esperado"
          }

          if ($latestText -notmatch '(?m)^path:\s*Obaflix-Setup-1\.0\.12\.exe\s*$') {
            throw "latest.yml (path) não referencia o EXE final esperado"
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $size = (Get-Item $exe).Length

          Write-Host "EXE=$exe"
          Write-Host "SIZE=$size"
          Write-Host "SHA256=$hash"
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT

      - name: Validar feed do updater no binário (app-update.yml)
        id: feed
        working-directory: desktop
        shell: pwsh
        run: |
          $appUpdate = "dist/win-unpacked/resources/app-update.yml"

          if (-not (Test-Path $appUpdate)) {
            throw "app-update.yml ausente no binário: $appUpdate"
          }

          $texto = Get-Content $appUpdate -Raw
          Write-Host $texto

          foreach ($esperado in @(
            '(?m)^provider:\s*github\s*$',
            '(?m)^owner:\s*RMMMICHAEL\s*$',
            '(?m)^repo:\s*obaflix\s*$'
          )) {
            if ($texto -notmatch $esperado) {
              throw "app-update.yml fora do esperado (github:RMMMICHAEL/obaflix): falhou em $esperado"
            }
          }

          "feed=github:RMMMICHAEL/obaflix" >> $env:GITHUB_OUTPUT

      - name: Validar Authenticode
        id: authenticode
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = Get-Item "dist/Obaflix-Setup-1.0.12.exe"
          $sig = Get-AuthenticodeSignature $exe.FullName

          Write-Host "Authenticode status: $($sig.Status)"
          "status=$($sig.Status)" >> $env:GITHUB_OUTPUT

          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            if ($sig.Status -ne "Valid") {
              throw "Assinatura Authenticode inválida: $($sig.Status)"
            }

            "valid=true" >> $env:GITHUB_OUTPUT
            Write-Host "Assinatura Authenticode válida."
          } else {
            "valid=false" >> $env:GITHUB_OUTPUT
            Write-Warning "Build sem secrets de assinatura: candidato não aprovado."
          }

      - name: Resumo do build
        if: always()
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          @(
            "## Obaflix Electron 1.0.12",
            "",
            "| Campo | Valor |",
            "|---|---|",
            "| Commit | ${{ steps.commit.outputs.sha }} |",
            "| publish_release | $env:PUBLISH_RELEASE |",
            "| SHA256 | ${{ steps.artefatos.outputs.sha256 }} |",
            "| Tamanho (bytes) | ${{ steps.artefatos.outputs.size }} |",
            "| Feed (app-update.yml) | ${{ steps.feed.outputs.feed }} |",
            "| Authenticode | ${{ steps.authenticode.outputs.status }} |"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Guardar candidato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obaflix-electron-1.0.12
          if-no-files-found: error
          path: |
            desktop/dist/Obaflix-Setup-1.0.12.exe
            desktop/dist/Obaflix-Setup-1.0.12.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/win-unpacked/resources/app-update.yml

      - name: Publicar release final no próprio repositório
        if: inputs.publish_release && steps.authenticode.outputs.valid == 'true'
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          $tag = "v1.0.12"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null

          if ($LASTEXITCODE -eq 0) {
            throw "A release/tag $tag já existe. Nada será sobrescrito."
          }

          gh release create $tag `
            "dist/Obaflix-Setup-1.0.12.exe" `
            "dist/Obaflix-Setup-1.0.12.exe.blockmap" `
            "dist/latest.yml" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --title "Obaflix 1.0.12" `
            --notes "Obaflix Desktop 1.0.12"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao publicar release."
          }

      - name: Verificar release publicada
        if: inputs.publish_release && steps.authenticode.outputs.valid == 'true'
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $json = gh release view "v1.0.12" `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,targetCommitish,assets

          if ($LASTEXITCODE -ne 0) {
            throw "Release v1.0.12 não pôde ser consultada."
          }

          Write-Host $json

          $release = $json | ConvertFrom-Json
          $nomes = @($release.assets | ForEach-Object { $_.name })

          foreach ($esperado in @(
            "Obaflix-Setup-1.0.12.exe",
            "Obaflix-Setup-1.0.12.exe.blockmap",
            "latest.yml"
          )) {
            if ($esperado -notin $nomes) {
              throw "Asset ausente na release: $esperado"
            }
          }

      - name: Reprovar build sem Authenticode válido
        if: steps.authenticode.outputs.valid != 'true'
        shell: pwsh
        run: |
          throw "FALTA_CERTIFICADO_AUTHENTICODE ou assinatura inválida: candidato não aprovado e nenhuma release criada."
