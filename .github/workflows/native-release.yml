name: Native release (AAB Play + APK externo)

# Só roda em push de TAGS native-release-* (sem branch, sem preview da Vercel). Assina com a upload key existente (mesmos segredos do
# android-build.yml) e verifica pacote, versão, certificado, permissões e flags. Não publica nada: gera artefatos para homologação.
on:
  push:
    tags: ['native-release-*']

permissions:
  contents: read

env:
  VERSION_NAME: "2.0.0"
  APK_CODE: "154"   # APK externo; o AAB da Play usa APK_CODE+1 para a Play nunca ficar abaixo do que foi sideloaded
  AAB_CODE: "155"
  EXPECTED_CERT: "BD:F6:4E:BF:3C:C9:F8:41:A0:5D:4A:60:D6:7C:39:BC:95:7F:69:C0:F4:FD:6B:66:C0:46:59:01:F6:A0:DE:04"
  LEGACY_APK_URL: "https://app.obaflix.online/Obaflix-1.0.24.apk"

jobs:
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node docs/verificar-contratos.mjs

  build:
    needs: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing configuration (existing upload key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 ausente"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties

      - name: Build AAB (playstore, com.obaflix)
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:bundlePlaystoreRelease -Pnuvio.android.distribution=playstore \
            -Pnuvio.app.versionName="$VERSION_NAME" -PobaflixVersionCode="$AAB_CODE" -PobaflixRewardedRelease=true \
            -Dorg.gradle.jvmargs=-Xmx6g -Pkotlin.daemon.jvmargs=-Xmx4g --no-daemon --console=plain

      - name: Build APK externo (full, com.obaflix)
        run: |
          ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.distribution=full -PobaflixExternalOfficial=true \
            -Pnuvio.app.versionName="$VERSION_NAME" -PobaflixVersionCode="$APK_CODE" -PobaflixRewardedRelease=true \
            -Dorg.gradle.jvmargs=-Xmx6g -Pkotlin.daemon.jvmargs=-Xmx4g --no-daemon --console=plain

      - name: Verify artifacts
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          AAB=$(find androidApp/build/outputs/bundle/playstoreRelease -name '*.aab' | head -1)
          APK=$(find androidApp/build/outputs/apk/full/release -name '*.apk')
          test "$(echo "$APK" | wc -l)" = "1" || { echo "esperava 1 APK externo unico, achei: $APK"; exit 1; }
          test -n "$AAB" && test -n "$APK" || { echo "artefato ausente"; exit 1; }
          cp "$AAB" out/Obaflix-play-$AAB_CODE.aab
          cp "$APK" out/Obaflix-$VERSION_NAME-externo-$APK_CODE.apk
          cp "$(find androidApp/build/intermediates/merged_manifests/playstoreRelease -name AndroidManifest.xml | head -1)" out/merged-manifest-play.xml

          echo "== AAB: certificado"
          AAB_CERT=$(keytool -printcert -jarfile "$AAB" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          echo "$AAB_CERT"; test "$AAB_CERT" = "$EXPECTED_CERT" || { echo "AAB com certificado diferente"; exit 1; }
          echo "== AAB: manifest (Play)"
          M=out/merged-manifest-play.xml
          grep -q 'package="com.obaflix"' $M || { echo "pacote do AAB errado"; exit 1; }
          ! grep -q 'REQUEST_INSTALL_PACKAGES' $M || { echo "AAB tem REQUEST_INSTALL_PACKAGES"; exit 1; }
          grep -A1 'obaflix.play_distribution' $M | grep -q 'value="true"' || { echo "play_distribution != true"; exit 1; }
          grep -A1 'obaflix.premium_demo' $M | grep -q 'value="false"' || { echo "premium_demo != false"; exit 1; }
          grep -A1 'obaflix.rewarded_release' $M | grep -q 'value="true"' || { echo "rewarded_release != true"; exit 1; }
          ! grep -q 'vercel.app' $M || echo "(aviso) vercel.app citado no manifest"
          echo "== APK externo"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee out/apk-cert.txt | grep -E "Verifies|SHA-256"
          APK_CERT=$(grep 'certificate SHA-256 digest' out/apk-cert.txt | head -1 | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')
          test "$APK_CERT" = "$EXPECTED_CERT" || { echo "APK com certificado diferente do esperado ($APK_CERT)"; exit 1; }
          python3 - "$APK" <<'PY'
          import sys,zipfile
          abis={n.split("/")[1] for n in zipfile.ZipFile(sys.argv[1]).namelist() if n.startswith("lib/")}
          print("ABIs:",sorted(abis)); assert abis=={"arm64-v8a","armeabi-v7a"},abis
          PY
          "$BT/aapt2" dump badging "$APK" > out/apk-badging.txt
          grep -E "^package:" out/apk-badging.txt
          grep -q "name='com.obaflix' versionCode='$APK_CODE' versionName='$VERSION_NAME'" out/apk-badging.txt || { echo "pacote/versao do APK errados"; exit 1; }
          grep -E "uses-permission" out/apk-badging.txt | sed "s/uses-permission: name=//" | tr '\n' ' '
          echo
          grep -q "REQUEST_INSTALL_PACKAGES" out/apk-badging.txt && echo "(externo: REQUEST_INSTALL_PACKAGES presente, esperado no flavor full)"

          echo "== Compatibilidade com o APK legado real"
          curl -fsSL "$LEGACY_APK_URL" -o legacy.apk
          "$BT/apksigner" verify --print-certs legacy.apk | grep 'certificate SHA-256 digest' | head -1 | tee out/legacy-cert.txt
          L=$(sed 's/.*: //' out/legacy-cert.txt | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')
          test "$L" = "$APK_CERT" || { echo "CERTIFICADO DO APK LEGADO DIFERE DO NOVO APK"; exit 1; }
          echo "certificado legado == novo APK"

          echo "== SHA256 / tamanho"
          (cd out && sha256sum *.aab *.apk | tee SHA256SUMS.txt; ls -l *.aab *.apk | awk '{print $5, $9}')
          rm -f "$RUNNER_TEMP/upload.jks" local.properties legacy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: obaflix-native-release-${{ github.sha }}
          path: out/
          if-no-files-found: error
