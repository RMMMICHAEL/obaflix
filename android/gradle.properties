org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# URL base do Obaflix — fonte unica.
# Lida por :core-extractor, :app e :tv. Antes vivia so no app/build.gradle; com
# tres modulos consumindo o mesmo valor, duplicar seria convite a divergencia.
obaflix.url=https://obaflix.vercel.app

# SHA-256 do certificado que assina os APKs atuais (nao e segredo). Para uma
# migracao a Play App Signing, acrescente o digest da chave da Play Console,
# separado por virgula, antes de publicar a primeira versao assinada por ela.
obaflix.allowedSigningCerts=bdf64ebf3cc9f841a05d4a60d67c39bc957f69c0f4fd6b66c0465901f6a0de04

# Manifesto central de atualizacao (JSON, hospedado no R2 — mesmo dominio dos
# instaladores em src/config/downloads.ts). Lido por :core-extractor, :app e
# :tv, mesmo motivo do obaflix.url acima. Ver docs/auto-atualizacao.md.
obaflix.updateManifestUrl=https://app.obaflix.online/update-manifest.json
