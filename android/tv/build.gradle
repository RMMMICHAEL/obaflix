plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.obaflix.tv'
    compileSdk 34

    defaultConfig {
        // applicationId proprio: a TV convive com o app movel no mesmo Google
        // account sem que uma instalacao substitua a outra.
        applicationId "com.obaflix.tv"

        // 21 cobre TV Box com Android 5 e 6, que e boa parte do parque instalado.
        // Nada aqui depende de Play Services — muitos TV Box AOSP nao os tem.
        minSdk 21
        targetSdk 34
        versionCode 41
        versionName "0.7.25"

        buildConfigField "String", "OBAFLIX_URL", "\"${project.property('obaflix.url')}\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${project.property('obaflix.updateManifestUrl')}\""
        // ABIs que existem no parque de TV: ARM nos aparelhos, x86_64 para o
        // emulador. Deixar de fora o x86 de 32 bits — que praticamente nao
        // existe em TV Box — devolve quase um megabyte do que o Conscrypt
        // acrescentou, sem tirar suporte de nenhum aparelho real.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        buildConfigField "boolean", "DIAG_LOGS", (project.hasProperty("diagLogs") ? "true" : "false")
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }

    // Mesmo motivo do :app e do :core-extractor: o android.jar de teste unitario
    // so tem stubs que lancam RuntimeException.
    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                rootProject.file('hardening-rules.pro'), 'proguard-rules.pro'
        }

        // APK de TESTE: mesmo codigo e mesma assinatura da release (a sessao so
        // persiste com o certificado aceito em obaflix.allowedSigningCerts), mas
        // nunca confundivel com ela nem capaz de virar ela:
        //  - pacote proprio (com.obaflix.tv.homologacao), convive com o oficial;
        //  - versao com sufixo -homologacao;
        //  - aponta so para o ambiente isolado, passado explicitamente;
        //  - auto-atualizacao desligada (manifesto vazio), para nao trocar o APK
        //    de teste pela release oficial no meio do smoke.
        // Uso: gradlew :tv:assembleHomologacao -Pobaflix.urlTeste=https://<ambiente-de-teste>
        // (o Android nao aceita build type comecando com "test")
        homologacao {
            initWith release
            applicationIdSuffix ".homologacao"
            versionNameSuffix "-homologacao"
            matchingFallbacks = ['release']
            def urlTeste = project.findProperty('obaflix.urlTeste')
            buildConfigField "String", "OBAFLIX_URL", "\"${urlTeste ?: ''}\""
            buildConfigField "String", "UPDATE_MANIFEST_URL", "\"\""
        }
    }

    // Sem a URL do ambiente isolado, o build de teste falha em vez de sair
    // apontando para Production ou para lugar nenhum.
    gradle.taskGraph.whenReady { grafo ->
        if (grafo.allTasks.any { it.name.toLowerCase().contains('homologacao') && it.project == project }) {
            def urlTeste = project.findProperty('obaflix.urlTeste')?.toString()
            if (!urlTeste?.startsWith('https://')) {
                throw new GradleException("assembleHomologacao exige -Pobaflix.urlTeste=https://<ambiente-de-teste>")
            }
            if (urlTeste == project.property('obaflix.url')) {
                throw new GradleException("obaflix.urlTeste nao pode ser a URL de Production")
            }

            // Toda URL do BuildConfig da homologacao — do :tv E do
            // :core-extractor — tem de ser https e fora de Production. Vazio so
            // e aceito para campo listado como desligado de proposito, e o app
            // precisa tratar esse vazio como "desligado" (UpdateChecker/Atualizador,
            // com teste). Foi um campo vazio fora dessa garantia que derrubou o
            // APK de homologacao no smoke.
            def desligadosDeProposito = ['UPDATE_MANIFEST_URL']
            def producao = project.property('obaflix.url').toString()
            [project, project(':core-extractor')].each { modulo ->
                modulo.android.buildTypes.homologacao.buildConfigFields.each { nome, campo ->
                    if (campo.type != 'String' || !nome.endsWith('URL')) return
                    def valor = campo.value.toString()
                    if (valor.startsWith('"') && valor.endsWith('"') && valor.length() >= 2) valor = valor.substring(1, valor.length() - 1)
                    if (valor.isEmpty()) {
                        if (!desligadosDeProposito.contains(nome)) {
                            throw new GradleException("homologacao: ${modulo.path} BuildConfig.${nome} vazio")
                        }
                    } else if (!valor.startsWith('https://')) {
                        throw new GradleException("homologacao: ${modulo.path} BuildConfig.${nome} precisa ser https")
                    } else if (valor == producao || valor.contains('obaflix.online')) {
                        throw new GradleException("homologacao: ${modulo.path} BuildConfig.${nome} aponta para Production")
                    }
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
        // O Compose for TV ainda marca a API como experimental. Optar aqui evita
        // espalhar @OptIn por cada composable da interface.
        freeCompilerArgs += [
            '-opt-in=androidx.tv.material3.ExperimentalTvMaterial3Api',
            // focusRestorer, animacao de entrada e saida dos paineis do player:
            // a interface de TV vive nas duas APIs, e optar aqui evita anotar
            // cada composable da tela.
            '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi',
            '-opt-in=androidx.compose.animation.ExperimentalAnimationApi',
            '-opt-in=androidx.compose.ui.ExperimentalComposeUiApi',
        ]
    }

    def keystorePropsFile = rootProject.file("key.properties")
    if (keystorePropsFile.exists()) {
        def keystoreProps = new Properties()
        keystoreProps.load(new FileInputStream(keystorePropsFile))
        signingConfigs {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
        // `initWith release` copia a configuracao antes desta atribuicao: sem
        // repetir aqui, o APK de homologacao sairia sem assinatura.
        buildTypes.homologacao.signingConfig signingConfigs.release
    }

    // Sem a chave de release o APK de homologacao nao persistiria a sessao
    // (assinatura fora de obaflix.allowedSigningCerts) e o smoke daria um
    // resultado falso. Melhor falhar o build.
    // So empacotamento exige a chave: os testes da variante (testHomologacaoUnitTest)
    // rodam sem assinatura.
    gradle.taskGraph.whenReady { grafo ->
        // Nomes exatos: o grafo dos testes da variante tambem tem tarefas
        // internas que comecam com `package`/`assemble` (recursos do teste).
        def tarefasQueGeramApk = ['assembleHomologacao', 'packageHomologacao', 'bundleHomologacao', 'installHomologacao']
        def empacota = grafo.allTasks.any { t -> t.project == project && tarefasQueGeramApk.contains(t.name) }
        if (!keystorePropsFile.exists() && empacota) {
            throw new GradleException("assembleHomologacao exige android/key.properties com a chave de release")
        }
    }
}

dependencies {
    // A prova de que a extracao e compartilhada: o app de TV consome o mesmo
    // modulo que o movel, sem uma linha de extrator propria.
    implementation project(':core-extractor')

    // 2024.06.00 = Compose 1.6.8. A 1.6.1 tinha o defeito de foco que
    // derrubava o aplicativo ao navegar entre fileiras com o D-Pad.
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Compose for TV: foco de D-Pad, halo desenhado pelo sistema, componentes
    // dimensionados para leitura a distancia.
    implementation 'androidx.tv:tv-material:1.0.0-alpha10'

    // Gerador de QR Code. Java puro, sem Play Services — TV Box AOSP nao os tem.
    // So o codificador entra no APK; o R8 remove o leitor, que nao usamos.
    implementation 'com.google.zxing:core:3.5.3'

    // Reproducao. O datasource do OkHttp deixa o player usar o mesmo cliente e
    // os mesmos headers da extracao — Referer errado e 403 na cara do usuario.
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'

    // Posteres e arte de fundo. O cache em memoria e limitado em MainActivity:
    // o padrao da biblioteca assume celular, e TV Box de 1 GB nao aguenta.
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Guarda o refresh token cifrado com chave do Android Keystore.
    // Exige API 23; abaixo disso ha fallback documentado em ArmazenamentoSessao.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    // JVM pura. O comportamento de foco do Compose so se prova em aparelho
    // (exige teste instrumentado com compose-ui-test); o que da para travar aqui
    // e a aritmetica de colunas e a fiacao da entrada de foco na fileira.
    testImplementation 'junit:junit:4.13.2'
}
