plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def diagLogs = project.hasProperty("diagLogs") ? "true" : "false"
def allowedSigningCerts = providers.gradleProperty("obaflix.allowedSigningCerts")
    .orElse(providers.environmentVariable("OBAFLIX_ALLOWED_SIGNING_CERTS"))
    .orElse("")
    .get()

android {
    // Namespace proprio: e o que decide onde BuildConfig e R sao gerados.
    // Os pacotes Kotlin continuam com.obaflix / com.obaflix.bridge /
    // com.obaflix.player — nenhum import mudou de lugar na extracao.
    namespace 'com.obaflix.core'
    compileSdk 34

    defaultConfig {
        // 21, nao 26: o :tv precisa alcancar TV Box com Android 5 e 6, e o
        // minSdk de uma biblioteca tem de ser menor ou igual ao de quem consome.
        minSdk 21

        buildConfigField "String", "OBAFLIX_URL", "\"${project.property('obaflix.url')}\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${project.property('obaflix.updateManifestUrl')}\""
        // Lista separada por virgula de SHA-256 dos certificados aceitos. O
        // digest e publico; a chave privada continua exclusivamente no
        // keystore/Play App Signing. Vazio deixa a verificacao observacional.
        buildConfigField "String", "ALLOWED_SIGNING_CERTS_SHA256", "\"${allowedSigningCerts}\""
        buildConfigField "boolean", "DIAG_LOGS", diagLogs

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // O android.jar de teste unitário só tem stubs que lançam RuntimeException
    // por padrão. SuperflixEmbedplayerFailoverTest exercita código de produção
    // que loga por android.util.Log (via ObaLog) — sem isto, o teste crasha em
    // "Method d in android.util.Log not mocked", não no que ele está de fato
    // verificando.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // `api` e nao `implementation`: quem consome o extractor recebe as respostas
    // do OkHttp e os tipos de corrotina na propria assinatura publica.
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    api 'androidx.webkit:webkit:1.12.1'

    // TLS 1.3 em Android antigo.
    //
    // Android 9 e anteriores nao negociam TLS 1.3, e ha provedor que so aceita
    // isso — o handshake falha e a fonte morre antes de qualquer requisicao.
    // Foi visto em campo com dois provedores no mesmo titulo. O Conscrypt traz
    // o BoringSSL junto, entao passa a nao depender do que o aparelho oferece.
    api 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'androidx.core:core-ktx:1.12.0'

    // JVM puro, sem Robolectric: cobre so a parte sem Android framework
    // (parser do manifesto, comparacao de versionCode, checksum). O que
    // depende de DownloadManager/FileProvider/Context continua validado por
    // build real + instalacao manual — ver docs/auto-atualizacao.md.
    testImplementation 'junit:junit:4.13.2'
    // org.json no classpath de teste unitario: o android.jar de unit test
    // so tem stubs que lancam RuntimeException. Sem esta dependencia,
    // UpdateManifestParser (que usa org.json.JSONObject) nao roda em teste.
    testImplementation 'org.json:json:20240303'
    // Servidor HTTP local para testar SuperflixExtractor ponta a ponta (POST
    // /player/source, GET /video/<id>, POST /player/index.php) sem tocar rede
    // real nem exigir Robolectric — mesma versao do OkHttp ja usado acima.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
