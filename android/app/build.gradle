plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.obaflix'
    compileSdk 34

    defaultConfig {
        applicationId "com.obaflix"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.0.9"
        // Mesmo valor que o :core-extractor le — ambos saem de gradle.properties.
        buildConfigField "String", "OBAFLIX_URL", "\"${project.property('obaflix.url')}\""

        // Diagnostico: liga a inspecao via chrome://inspect tambem no APK de
        // release. O logcat estruturado ([oba]) sai sempre; isto e so para quando
        // ver o DOM/rede do player e necessario num aparelho onde o bug aparece.
        //   ./gradlew assembleRelease -PdiagLogs
        buildConfigField "boolean", "DIAG_LOGS", (project.hasProperty("diagLogs") ? "true" : "false")
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                rootProject.file('hardening-rules.pro'), 'proguard-rules.pro'
        }
        debug {
            // Para dev local: alterar OBAFLIX_URL para http://10.0.2.2:3000 (emulador)
            // ou http://<IP-LAN>:3000 (dispositivo fÃ­sico)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Signing â€” cria android/key.properties (nÃ£o commitado) com:
    // storeFile, storePassword, keyAlias, keyPassword
    def keystorePropsFile = rootProject.file("key.properties")
    if (keystorePropsFile.exists()) {
        def keystoreProps = new Properties()
        keystoreProps.load(new FileInputStream(keystorePropsFile))
        signingConfigs {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
}

dependencies {
    // Extracao de midia compartilhada com o :tv. Traz okhttp, corrotinas e
    // webkit como `api`, alem das regras de R8 da ponte JS.
    implementation project(':core-extractor')

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
