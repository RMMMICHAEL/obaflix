plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.obaflix'
    compileSdk 34

    defaultConfig {
        applicationId "com.obaflix"
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "1.0.15"
        // Mesmo valor que o :core-extractor le — ambos saem de gradle.properties.
        buildConfigField "String", "OBAFLIX_URL", "\"${project.property('obaflix.url')}\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${project.property('obaflix.updateManifestUrl')}\""

        // Diagnostico: liga a inspecao via chrome://inspect tambem no APK de
        // release. O logcat estruturado ([oba]) sai sempre; isto e so para quando
        // ver o DOM/rede do player e necessario num aparelho onde o bug aparece.
        //   ./gradlew assembleRelease -PdiagLogs
        buildConfigField "boolean", "DIAG_LOGS", (project.hasProperty("diagLogs") ? "true" : "false")

        // Unity Ads — so o aplicativo movel monetiza. O :tv e o Electron nao
        // tem nem a dependencia. Game ID e Placement ID sao identificadores
        // publicos do painel da Unity, nao segredos: nenhuma chave de API entra
        // no APK por causa disto.
        buildConfigField "String", "UNITY_ADS_GAME_ID", "\"800367180\""
        buildConfigField "String", "UNITY_ADS_PLACEMENT_ID", "\"Interstitial_Android\""

        // UNITY_ADS_TEST_MODE NAO mora aqui de proposito — ver buildTypes.
        // Um valor unico em defaultConfig e o que faz um APK de release sair com
        // anuncio de teste (sem receita) ou um APK de debug consumir trafego
        // real. A escolha e do tipo de build, e cada um declara o seu.
    }

    buildFeatures {
        buildConfig true
    }

    // Anuncio de teste ou anuncio real: decidido pelo TIPO DE BUILD, nunca por
    // um valor unico compartilhado. `-PunityAdsTest` forca o modo de teste
    // tambem no release — serve para validar o APK assinado e minificado sem
    // queimar impressao real, e segue o mesmo padrao do -PdiagLogs acima. Nao
    // existe o caminho inverso: nao ha como um build de debug pedir anuncio
    // real, entao desenvolvimento nunca consome trafego de producao.
    def unityAdsTesteForcado = project.hasProperty("unityAdsTest")

    // Sem -PdiagLogs, o release remove Log.v/d/i como sempre. Com a flag, o
    // arquivo que faz essa remocao fica de fora e a trilha do ObaLog sobrevive —
    // e a unica forma de validar o fluxo de anuncio num APK de producao
    // (anuncio real, minificado, assinado) e ver ads_hold_armed,
    // ads_episode_intent e ads_dismiss_confirmed no logcat. Nada mais muda: o
    // ObaLog ja liberava a trilha por BuildConfig.DIAG_LOGS, e o que a apagava
    // era o R8.
    def removerLogsDeDesenvolvimento = !project.hasProperty("diagLogs")

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                rootProject.file('hardening-rules.pro'), 'proguard-rules.pro'
            if (removerLogsDeDesenvolvimento) {
                proguardFiles rootProject.file('hardening-logs.pro')
            }

            // PRODUCAO: anuncios reais da Unity, com receita e impressao contada.
            //   ./gradlew :app:assembleRelease                 -> anuncio REAL
            //   ./gradlew :app:assembleRelease -PunityAdsTest  -> anuncio de teste
            buildConfigField "boolean", "UNITY_ADS_TEST_MODE",
                (unityAdsTesteForcado ? "true" : "false")
        }
        debug {
            // Para dev local: alterar OBAFLIX_URL para http://10.0.2.2:3000 (emulador)
            // ou http://<IP-LAN>:3000 (dispositivo fÃ­sico)

            // DESENVOLVIMENTO: sempre anuncio de teste. Nao gera receita, nao
            // conta impressao e nao arrisca a conta da Unity com trafego de
            // aparelho de teste. Fixo em true: nao ha propriedade que mude isto.
            buildConfigField "boolean", "UNITY_ADS_TEST_MODE", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Mesmo motivo do :core-extractor: os testes de politica de anuncio passam
    // por ObaLog, que chama android.util.Log. Sem isto o android.jar de teste
    // unitario lanca "not mocked" antes de o teste verificar o que interessa.
    testOptions {
        unitTests.returnDefaultValues = true
    }

    // Signing â€” cria android/key.properties (nÃ£o commitado) com:
    // storeFile, storePassword, keyAlias, keyPassword
    def keystorePropsFile = rootProject.file("key.properties")
    if (keystorePropsFile.exists()) {
        def keystoreProps = new Properties()
        keystoreProps.load(new FileInputStream(keystorePropsFile))
        signingConfigs {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
}

dependencies {
    // Extracao de midia compartilhada com o :tv. Traz okhttp, corrotinas e
    // webkit como `api`, alem das regras de R8 da ponte JS.
    implementation project(':core-extractor')

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Download — Storage Access Framework. E a unica forma de escrever na pasta
    // que o usuario escolheu sem pedir permissao ampla de armazenamento.
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // registerForActivityResult, para o seletor de diretorio e para
    // POST_NOTIFICATIONS.
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // Monetizacao — exclusiva do aplicativo movel.
    //
    // 4.18.1 e nao a 4.20.0 (a mais recente em setembro/2026) de proposito: da
    // 4.19.0 em diante o SDK passa a depender de kotlin-stdlib 2.1.x, cujo
    // metadata o compilador Kotlin 1.9.22 deste projeto recusa. Subir a versao
    // exige subir o Kotlin dos tres modulos antes — mudanca que nao pertence a
    // esta tarefa. A 4.18.1 traz kotlin-stdlib 1.8.10 e coroutines 1.6.4, ambos
    // abaixo do que o projeto ja usa, entao a resolucao do Gradle nao rebaixa
    // nada.
    implementation 'com.unity3d.ads:unity-ads:4.18.1'
    // O POM da Unity declara adquality-sdk como faixa aberta "(,10.0.0)", o que
    // deixa o build nao reproduzivel — duas maquinas podem resolver versoes
    // diferentes. Fixado na maior existente hoje; sem dependencias proprias.
    implementation 'com.unity3d.ads-mediation:adquality-sdk:9.9.0'

    // Politica de anuncio e gate rodam em JVM pura, sem SDK nem Activity. O
    // mesmo vale para download e transmissao: classificacao da fonte, parser e
    // reescrita de HLS, sondagem de qualidade, fila e montagem do Intent.
    testImplementation 'junit:junit:4.13.2'
    // org.json no classpath de teste: o android.jar de teste unitario so tem
    // stubs. Sem isto, DownloadRecord e QualidadeDownload (que serializam com
    // JSONObject) nao rodam em teste.
    testImplementation 'org.json:json:20240303'
    // A barreira que impede o player de tocar durante o anuncio e JavaScript
    // (AdGateScript). Sem um motor JS no teste, a unica prova dela seria o
    // aparelho — e foi exatamente ela que falhou no teste fisico. Rhino executa
    // o script de verdade em AdGateScriptTest, com relogio controlado. Nao entra
    // no APK: `testImplementation`.
    testImplementation 'org.mozilla:rhino:1.7.14'
}
