name = "obaflix-media"
main = "src/worker.ts"
compatibility_date = "2026-08-30"

# Sem KV, sem D1, sem Durable Objects: o Worker não guarda estado. Tudo que ele
# precisa saber vem assinado no pedido.

[vars]
# Origem única autorizada no CORS. Não use "*": seria proxy aberto para
# qualquer site que descobrisse uma URL assinada. É o domínio de produção do
# app (onde o player roda), e não o domínio *.vercel.app: um valor que não bata
# com a origem da página faz o navegador descartar o manifesto por CORS — o
# canal aparece e não toca.
APP_ORIGIN = "https://obaflix.online"

# CDN_ALLOWLIST, CANAIS_PLAYER_ALLOWLIST e CANAIS_MEDIA_BASE NÃO vivem aqui: são
# configuração remota do Worker (dashboard/`wrangler secret`/`--var`). Versioná-las
# vazias fazia um `wrangler deploy` comum zerar a config de produção — allowlist
# vazia recusa tudo, base vazia quebra a reescrita do manifesto.
#   - CDN_ALLOWLIST: sufixos de host aceitos como alvo de mídia.
#   - CANAIS_PLAYER_ALLOWLIST: sufixos da PÁGINA que arma o grant (lista própria,
#     nunca a de CDN — juntá-las daria a um host de CDN o direito de ser buscado
#     como página de arm). Vazia recusa o arm, nunca o libera.
#   - CANAIS_MEDIA_BASE: base pública deste Worker; o mesmo valor no backend.
# Publique SEMPRE com `wrangler deploy --keep-vars` para preservar o que já está
# no remoto.

# ASSINATURA_SECRET NÃO vai aqui. É o CANAIS_MEDIA_SIGNING_SECRET do backend —
# um segredo próprio, criado só para isto, e NÃO o NEXTAUTH_SECRET: este Worker
# roda em infra de terceiro, e um vazamento aqui não pode alcançar a assinatura
# de sessão de autenticação do produto.
#   npx wrangler secret put ASSINATURA_SECRET
#   npx wrangler secret put UPSTASH_REDIS_REST_URL
#   npx wrangler secret put UPSTASH_REDIS_REST_TOKEN

# ── Ambiente de TESTE (smoke isolado de canais) ──────────────────────────────
#
# Worker separado (nome proprio), apontando para a origem do deploy de teste.
# Segredos proprios, NUNCA os de producao, e o Redis exclusivo de teste:
#   npx wrangler secret put ASSINATURA_SECRET --env teste
#   npx wrangler secret put UPSTASH_REDIS_REST_URL --env teste
#   npx wrangler secret put UPSTASH_REDIS_REST_TOKEN --env teste
# Deploy (so com autorizacao especifica):
#   npx wrangler deploy --env teste
[env.teste]
name = "obaflix-media-teste"

[env.teste.vars]
# Preencher com a origem do deploy de teste antes do deploy.
APP_ORIGIN = ""
CDN_ALLOWLIST = ""
CANAIS_PLAYER_ALLOWLIST = ""
# URL publica do Worker de teste; o mesmo valor de CANAIS_MEDIA_BASE do backend de teste.
CANAIS_MEDIA_BASE = ""
